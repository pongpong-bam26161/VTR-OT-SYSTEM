<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<title>VTR OT System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky role bar + tab strip, single working column (max 1100px) of cards and tables; mobile-first for managers on phones. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#16202a; --muted:#5a6775; --line:#d6dde4;
  --accent:#1d5ea8; --accent-ink:#ffffff; --accent-soft:#e2ecf8;
  --ok:#2b7a4b; --ok-soft:#e1f2e8; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b0281f; --bad-soft:#fbe4e2;
  --bar-1:#9fb3c8; --bar-2:#6f9fd6; --bar-3:#1d5ea8;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#182028; --surface-2:#1d2630; --ink:#e5eaef; --muted:#93a1af; --line:#2b3642;
  --accent:#6ea6ea; --accent-ink:#0b1622; --accent-soft:#1b2c40;
  --ok:#5cc08a; --ok-soft:#173326; --warn:#e2a647; --warn-soft:#3a2b12; --bad:#ef7d74; --bad-soft:#3d1c1a;
  --bar-1:#4a5b6d; --bar-2:#4f7fb8; --bar-3:#8ab8f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#182028; --surface-2:#1d2630; --ink:#e5eaef; --muted:#93a1af; --line:#2b3642;
  --accent:#6ea6ea; --accent-ink:#0b1622; --accent-soft:#1b2c40;
  --ok:#5cc08a; --ok-soft:#173326; --warn:#e2a647; --warn-soft:#3a2b12; --bad:#ef7d74; --bad-soft:#3d1c1a;
  --bar-1:#4a5b6d; --bar-2:#4f7fb8; --bar-3:#8ab8f0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;background:var(--accent);border-radius:2px}
.rolebox{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
.tabs button{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 10px 9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>*{min-width:0}
.grow{flex:1 1 160px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:120px;font-family:var(--f-mono);font-size:13px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:6px;padding:10px 16px;min-height:42px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{border-radius:6px;padding:10px 12px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.calc div{background:var(--surface-2);border-radius:6px;padding:10px 12px}
.calc b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.calc span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;border-bottom:0}
table input,table select{min-height:36px;padding:6px 8px}
.emp{display:grid;grid-template-columns:auto 1fr 84px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.emp:last-child{border-bottom:0}
.emp .who{min-width:0}
.emp .who b{display:block;font-weight:500;overflow-wrap:anywhere}
.emp input[type=number]{text-align:right}
.reqhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.reqhead h3{margin-right:auto}
.lines{font-size:14px;display:flex;flex-direction:column;gap:2px}
.hist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:500}
.kpi>span:not(.pill){font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block}
.kpi .pill{margin-top:4px;margin-right:2px}
.bars{display:flex;flex-direction:column;gap:12px}
.bargroup{display:grid;grid-template-columns:minmax(90px,140px) 1fr;gap:4px 10px;align-items:center}
.bargroup .lbl{font-weight:500;font-size:14px;grid-row:span 3;overflow-wrap:anywhere}
.track{display:flex;align-items:center;gap:6px;min-width:0}
.track i{display:block;height:10px;border-radius:2px;min-width:2px}
.track em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><i></i>VTR OT System</div>
      <div class="rolebox">
        <select id="role" aria-label="Role"></select>
        <select id="mydept" aria-label="My department"></select>
        <select id="mydiv" data-bind="mydiv" aria-label="My division"></select>
      </div>
      <span id="conn" class="pill">Connecting…</span>
      <button id="signout" class="btn sm" data-act="signout" hidden>Sign out</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ============ Example master data (shown until real data is saved in Setup) ============ */
/* No company data is kept in the code (the repository is public). Departments, machines, rates and staff
   live in Firestore and are loaded by an admin from the data file (Admin → Data). */
const EXAMPLE={example:true,normalHours:8,rounding:'nearest',autoApprove:true,rateWeekday:1.5,rateWeekend:2,rateHoliday:2,tolerance:10,attGrace:10,
  holidays:[],reasons:['อื่นๆ / Other'],shifts:[{id:'D',name:'Day',start:'06:30',end:'16:30'},{id:'N',name:'Night',start:'18:30',end:'04:30'}],
  depts:[],machines:[],employees:[]};

/* ============ State & storage ============ */
const S={config:null,staff:{},plans:{},requests:{},actuals:{},days:{},attendance:{},sync:null,users:{},_cfg:null};
const COLLS=['plans','requests','actuals','days'];
let db=null,mode='connecting',me={id:null},userNs=null,dl=null;
const nameCache={};
const LS='otp-local-v1';
function rebuildCfg(){
  if(!S.config){S._cfg=null;return}
  const emps=[];for(const [d,doc] of Object.entries(S.staff||{}))for(const a of (doc.list||[]))emps.push({id:a[0],name:a[1],crew:a[2],dept:d,position:a[3],kind:a[4],link:a[5]});
  emps.sort((a,b)=>a.dept.localeCompare(b.dept)||String(a.crew).localeCompare(String(b.crew))||a.name.localeCompare(b.name));
  S._cfg={...S.config,machines:S.config.machines||[],employees:emps};
}
function cfg(){return S._cfg||EXAMPLE}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

let myAccess=null;
const ROLE_KEYS={'Department manager':'dept','Division manager':'division','Plant manager':'plant','Planner':'planner','Accountant':'accountant','HR (view only)':'hr','HR':'hr','Admin':'admin'};
function allowedRoles(){
  if(!myAccess)return Object.keys(ROLES);
  const keys=[...new Set((myAccess.roleNames||[]).map(n=>ROLE_KEYS[n]).filter(Boolean))];
  return keys.includes('admin')?Object.keys(ROLES):keys;
}
const isAdmin=()=>!myAccess||(myAccess.roleNames||[]).includes('Admin');
async function initStore(){
  if(window.FIREBASE_CONFIG&&window.firebase){
    try{if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG)}catch(e){}
    mode='auth';render();
    firebase.auth().onAuthStateChanged(async u=>{
      if(!u){mode='signin';myAccess=null;render();return}
      me={id:u.uid,name:u.displayName||u.email,email:(u.email||'').toLowerCase()};
      db=firebase.firestore();
      try{const d=await db.collection('users').doc(me.email).get();myAccess=d.exists?d.data():null}catch(e){myAccess=null}
      if(!myAccess||myAccess.active===false){mode='noaccess';render();return}
      const ok=allowedRoles();if(!ok.includes(role)){role=ok[0]||'dept';tab=ROLES[role].tabs[0][0]}
      if(role==='dept'&&!isAdmin()&&(myAccess.depts||[]).length&&!(myAccess.depts||[]).includes(myDept))myDept=myAccess.depts[0];
      if(role==='division'&&!isAdmin()&&(myAccess.divisions||[]).length===1)V.myDiv=myAccess.divisions[0];
      startLive();
    });
    return;
  }
  mode='local';
  try{const o=JSON.parse(lsGet(LS)||'null');if(o){Object.assign(S,o);S.staff=S.staff||{};S.attendance=S.attendance||{}}}catch(e){}rebuildCfg();
  render();
}
function startLive(){
  mode='connecting';render();
  const seeScans=isAdmin()||(myAccess.roleNames||[]).some(n=>/^(Accountant|HR)/.test(n));
  let got=0;const need=(seeScans?3:2)+COLLS.length;
  const timer=setTimeout(()=>{if(got<need){mode='slow';render()}},10000);
  const done=()=>{got++;if(got>=need){clearTimeout(timer);mode='live'}scheduleRender()};
  const seen=new Set();
  db.doc('sync/state').onSnapshot(s=>{S.sync=s.exists?s.data():null;scheduleRender()},()=>{});
  db.doc('config/main').onSnapshot(s=>{S.config=s.exists?s.data():null;rebuildCfg();if(!seen.has('c')){seen.add('c');done()}else scheduleRender()},err);
  if(seeScans)db.collection('attendance').orderBy('date','desc').limit(93).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.attendance=o;if(!seen.has('att')){seen.add('att');done()}else scheduleRender()},err);
  db.collection('staff').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.staff=o;rebuildCfg();if(!seen.has('staff')){seen.add('staff');done()}else scheduleRender()},err);
  for(const c of COLLS){
    db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S[c]=o;if(!seen.has(c)){seen.add(c);done()}else scheduleRender()},err);
  }
  if(isAdmin())db.collection('users').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.users=o;scheduleRender()},()=>{});
}
function err(e){toast(e&&e.code==='permission-denied'?'Your account is not allowed to read this data. Ask the admin to check your role.':'Could not sync: '+(e&&e.message||'unknown error'))}
function saveLocal(){const {_cfg,...o}=S;lsSet(LS,JSON.stringify(o))}
async function put(coll,id,data){
  if(mode==='local'||!db){ if(coll==='config'){S.config=data}else{S[coll][id]=data} rebuildCfg();saveLocal();scheduleRender();return }
  const clean=JSON.parse(JSON.stringify(data)); /* Firestore refuses undefined values */
  if(coll==='config') return db.doc('config/main').set(clean);
  return db.collection(coll).doc(id).set(clean);
}
async function del(coll,id){
  if(mode==='local'||!db){delete S[coll][id];rebuildCfg();saveLocal();scheduleRender();return}
  return db.collection(coll).doc(id).delete();
}

/* ============ Helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=1)=>x==null||isNaN(x)?'–':(+x).toFixed(d).replace(/\.0+$/,'');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{const d=new Date(s+'T00:00:00');return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dept=id=>cfg().depts.find(d=>d.id===id);
const emp=id=>cfg().employees.find(e=>e.id===id);
const shift=id=>cfg().shifts.find(s=>s.id===id);
const empName=id=>emp(id)?.name||'(removed staff)';
function addTime(t,h){if(!t)return '';const[a,b]=t.split(':').map(Number);let m=Math.round(a*60+b+h*60);m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function dayInfo(date){
  const c=cfg(),d=new Date(date+'T00:00:00'),dow=d.getDay(),hol=(c.holidays||[]).includes(date),we=dow===0||dow===6;
  return {normal:(hol||we)?0:+c.normalHours, mult:hol?+c.rateHoliday:we?+c.rateWeekend:+c.rateWeekday,
    label:hol?'Public holiday':dow===6?'Saturday':dow===0?'Sunday':'Weekday', off:hol||we};
}
function rnd(x){const m=cfg().rounding,v=x*2;return (m==='up'?Math.ceil(v-1e-9):m==='down'?Math.floor(v+1e-9):Math.round(v+1e-9))/2}
const pk=(date,sh,d)=>`${date}_${sh}_${d}`;
const machine=id=>(cfg().machines||[]).find(m=>m.id===id);
const machinesOf=d=>(cfg().machines||[]).filter(m=>m.dept===d&&+m.rate>0);
/* A department ending in 0 (e.g. 130) also covers its units (131, 132). Used for management OT. */
const parentOf=c=>{c=String(c);if(c.endsWith('0'))return null;const p=c.slice(0,-1)+'0';return dept(p)?p:null};
const machinesUnder=d=>(cfg().machines||[]).filter(m=>+m.rate>0&&(m.dept===d||parentOf(m.dept)===d));
const hasRate=d=>machinesOf(d).length>0;
function justified(date,sh,mId){
  const m=machine(mId),p=S.plans[pk(date,sh,mId)];
  if(!m||!(+m.rate>0)||!p||!(+p.qty>0))return null;
  const req=p.hours!=null?+p.hours:+p.qty/+m.rate;
  return {qty:+p.qty,reqHours:req,detail:p.detail||null,actualHours:p.actualHours??null,ot:Math.max(0,rnd(req-dayInfo(date).normal)),m};
}
/* Management OT follows the longest-running planned machine in the linked department. */
function deptJustified(date,sh,d){
  let best=null;for(const m of machinesUnder(d)){const j=justified(date,sh,m.id);if(j&&(!best||j.ot>best.ot))best=j}
  return best;
}
function deptActualRun(date,sh,d){
  let best=null;for(const m of machinesUnder(d)){const a=S.actuals[pk(date,sh,m.id)];if(a&&(best==null||+a.run>best))best=+a.run}
  return best;
}
function defaultStart(date,sh){const s=shift(sh);if(!s)return '';return dayInfo(date).off?s.start:s.end}
function lineActual(r,l){
  if(r.type==='replacement'||r.type==='other')return l.worked===true?+l.hours:l.worked===false?0:null;
  const run=r.type==='production'?(S.actuals[pk(r.date,r.shift,r.machine)]?.run??null):deptActualRun(r.date,r.shift,r.dept);
  if(run==null)return null;
  return Math.max(0,rnd(+run-dayInfo(r.date).normal));
}
const STATUS={pending:['Waiting for division manager','warn'],returned:['Sent back for changes','bad'],div_approved:['Waiting for plant manager','acc'],approved:['Approved','ok'],rejected:['Rejected','bad']};
const TYPE={production:'Production',management:'Management',replacement:'Replacement',other:'Other'};
function statusPill(r){const[t,c]=STATUS[r.status]||[r.status,''];return `<span class="pill ${c}">${t}</span>`}
function hist(r,action,note){return [...(r.history||[]),{at:new Date().toISOString(),by:me.id||null,byName:me.name||'',role:ROLES[role]?.label||role,action,note:note||''}]}
function whoName(h){const n=h.byName||(h.by&&nameCache[h.by]);return n?`${n} (${h.role})`:h.role}
async function resolveNames(){
  if(!userNs||!userNs.profiles)return;
  const ids=new Set();Object.values(S.requests).forEach(r=>(r.history||[]).forEach(h=>h.by&&!(h.by in nameCache)&&ids.add(h.by)));
  Object.values(S.days).forEach(d=>d.by&&!(d.by in nameCache)&&ids.add(d.by));
  if(!ids.size)return;
  try{const ps=await userNs.profiles([...ids]);let ch=false;for(const id of ids){nameCache[id]=(ps&&ps[id]&&ps[id].name)||'';ch=true}if(ch)scheduleRender()}catch(e){}
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

let rq=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#main').contains(a)){pendingRender=true;return}render()})}
let pendingRender=false;
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();else pendingRender=true},0)}});

function render(){
  const c=cfg();
  $('#signout').hidden=!(mode==='live'||mode==='slow'||mode==='connecting'||mode==='noaccess');
  if(mode==='auth'||mode==='signin'||mode==='noaccess'){
    $('#conn').className='pill';$('#conn').textContent=mode==='auth'?'Starting…':'Signed out';
    $('#role').hidden=true;$('#mydept').hidden=true;$('#mydiv').hidden=true;$('#tabs').innerHTML='';
    $('#main').innerHTML=mode==='auth'?'<div class="empty">Loading…</div>':mode==='signin'
      ?`<div class="card" style="max-width:460px;margin:40px auto;text-align:center;align-items:center"><h2>VTR OT System</h2><p class="muted">Sign in with your company Google account.</p><button class="btn primary" data-act="signin">Sign in with Google</button></div>`
      :`<div class="card" style="max-width:520px;margin:40px auto"><h2>No access yet</h2><p>You are signed in as <b>${esc(me.email||'')}</b>, but this account is not on the user list, or it is not active.</p><p class="muted">Ask the admin to add you (Admin → Users), then sign in again.</p></div>`;
    return;
  }
  $('#role').hidden=false;
  const conn=$('#conn');
  conn.className='pill '+(mode==='live'?'ok':mode==='local'?'warn':'');
  conn.textContent=mode==='live'?(me.name?me.name:'Live'):mode==='local'?'Offline · this browser only':mode==='slow'?'Still connecting…':'Connecting…';
  const okRoles=allowedRoles();if(!okRoles.includes(role))role=okRoles[0]||'dept';
  $('#role').innerHTML=Object.entries(ROLES).filter(([k])=>okRoles.includes(k)).map(([k,v])=>`<option value="${k}"${k===role?' selected':''}>${v.label}</option>`).join('');
  const md=$('#mydept');md.hidden=role!=='dept';

  const myDepts=isAdmin()||!(myAccess&&(myAccess.depts||[]).length)?c.depts:c.depts.filter(d=>(myAccess.depts||[]).includes(d.id));
  if(myDepts.length&&!myDepts.find(d=>d.id===myDept))myDept=myDepts[0].id;
  md.innerHTML=myDepts.map(d=>`<option value="${esc(d.id)}"${d.id===myDept?' selected':''}>${esc(d.id)} ${esc(d.name)}</option>`).join('');
  const mv=$('#mydiv');mv.hidden=role!=='division';const divs=[...new Set(c.depts.map(d=>d.division).filter(Boolean))].filter(x=>isAdmin()||!(myAccess&&(myAccess.divisions||[]).length)||(myAccess.divisions||[]).includes(x));
  mv.innerHTML=(isAdmin()||divs.length>1?`<option value="">All divisions</option>`:'')+divs.map(x=>`<option${x===V.myDiv?' selected':''}>${esc(x)}</option>`).join('');
  const tabs=ROLES[role].tabs;if(!tabs.find(t=>t[0]===tab))tab=tabs[0][0];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-act="tab" data-v="${k}" aria-current="${k===tab}">${l}</button>`).join('');

  let banner='';

function planPreview(d){
  const dep=machine(d),v=+$('#plan-'+CSS.escape(d)).value,di=dayInfo(V.planDate);
  const ok=v>0&&dep.rate>0,req=ok?v/dep.rate:null,ot=ok?Math.max(0,rnd(req-di.normal)):null;
  $('#ph-'+CSS.escape(d)).textContent=ok?fmt(req,2):'–';$('#po-'+CSS.escape(d)).innerHTML='<b>'+(ok?fmt(ot):'–')+'</b>';$('#pt-'+CSS.escape(d)).textContent=ok&&+dep.crew?fmt(ot*dep.crew):'–';
}
async function savePlan(){
  const ps=[];
  for(const m of (cfg().machines||[]).filter(m=>+m.rate>0)){
    const el=$('#plan-'+CSS.escape(m.id));if(!el)continue;const v=el.value.trim(),k=pk(V.planDate,V.planShift,m.id),cur=S.plans[k];
    if(v===''){if(cur)ps.push(del('plans',k));continue}
    if(cur&&+cur.qty===+v)continue;
    ps.push(put('plans',k,{date:V.planDate,shift:V.planShift,dept:m.dept,machine:m.id,qty:+v,at:new Date().toISOString(),by:me.id||null}));
  }
  try{await Promise.all(ps);toast(ps.length?'Plan saved':'No changes to save')}catch(e){toast('Could not save plan: '+(e.message||e.code))}
}

    :(ms.length?`<div class="note warn">No production plan yet for ${esc(dr.type==='production'&&M?M.name:D.name)} on this date and shift. You can still request, but it will need a reason and manual approval.</div>`:''));

   :backN?`<div class="note bad small">${backN} request${backN>1?'s were':' was'} sent back for changes. Open <b>My requests</b> to edit and resend.</div>`:''}

    ${calcBox}</div>

  <div class="card" id="sumcard">${sumCard(evalr)}</div>`;

/* Fill the request from the planner's calculation whenever date, shift, type or machine changes.
   People: the last request for the same machine (or type) in this department, otherwise everyone who fits.
   Hours: the calculated OT per person. The manager then unticks or edits before submitting. */
function prefill(dr,D){
  if(dr.editId)return;
  if(dr.type==='replacement')return;
  const c=cfg();
  const j=dr.type==='production'?justified(dr.date,dr.shift,dr.machine):dr.type==='management'?deptJustified(dr.date,dr.shift,D.id):null;
  const key=[myDept,dr.date,dr.shift,dr.type,dr.machine,j?j.ot:'-',c.employees.length,Object.keys(S.requests).length>0].join('|');
  if(dr.prefillKey===key)return;
  if(dr.prefillKey&&dr.touched&&dr.prefillKey.split('|').slice(0,5).join('|')===key.split('|').slice(0,5).join('|'))return;
  dr.prefillKey=key;dr.prefillNote='';dr.touched=false;
  const last=Object.values(S.requests).filter(r=>r.dept===myDept&&r.type===dr.type&&(dr.type!=='production'||r.machine===dr.machine)&&r.date!==dr.date).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt))[0];
  dr.sel={};dr.task={};
  if(dr.type==='other'){
    if(last){for(const l of last.lines)if(emp(l.emp)){dr.sel[l.emp]=l.hours;if(l.task)dr.task[l.emp]=l.task}dr.start=last.lines[0]?.start||'';dr.reason=last.reason||'';dr.prefillNote=`Pre-filled with ${Object.keys(dr.sel).length} people from the request of ${fmtDate(last.date)}.`}
    return;
  }
  if(!j){dr.prefillNote='';return}
  if(!(j.ot>0)){dr.prefillNote=`The plan needs ${fmt(j.reqHours,1)} h, which fits in normal hours. No OT is calculated, so nobody is pre-selected.`;return}
  let people;
  if(last)people=last.lines.map(l=>l.emp).filter(id=>emp(id));
  else if(dr.type==='management')people=c.employees.filter(e=>e.kind==='management'&&e.link===D.id).map(e=>e.id);
  else{dr.prefillNote=`The plan needs ${fmt(j.ot)} h OT per person. Tap Select Shift A or Select Shift B to tick that crew with ${fmt(j.ot)} h each, then untick anyone absent. Next time the same people are filled in automatically.`;return}
  for(const id of people)dr.sel[id]=j.ot;
  if(last)for(const l of last.lines)if(l.task&&dr.sel[l.emp]!=null)dr.task[l.emp]=l.task;
  dr.prefillNote=last?`Pre-filled from the plan: ${people.length} people × ${fmt(j.ot)} h, the same people as on ${fmtDate(last.date)}. Untick anyone absent or change hours, then submit.`
    :`Pre-filled from the plan: ${fmt(j.ot)} h for everyone in the department (${people.length} people), because this is the first request${dr.type==='production'?' for this machine':''}. Press Clear and tick only the people working, or untick the others. Next time the same people are filled in automatically.`;
}
/* Shift codes from HR: A/A8 = shift A, B/B8 = shift B, Day9-xxxx = day workers, N9-xxxx = night workers. */
function crewGroup(c){c=String(c||'');if(/^A/i.test(c))return 'A';if(/^B/i.test(c))return 'B';if(/^Day/i.test(c))return 'Day';if(/^N/i.test(c))return 'Night';return c||'Other'}
function crewLabel(g){return g==='A'?'Shift A':g==='B'?'Shift B':g==='Day'?'Day workers':g==='Night'?'Night workers':'Crew '+g}
function lastReq(type){if(type==='replacement')return null;return Object.values(S.requests).filter(r=>r.dept===myDept&&r.type===type).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt))[0]||null}
function evalDraft(){
  const c=cfg(),dr=V.draft,D=dept(myDept);if(!dr||!D)return null;
  const start=dr.start||defaultStart(dr.date,dr.shift);
  let lines=[],jPer=null,jTotal=0,over=false,why=[];
  if(dr.type==='other'){
    lines=Object.entries(dr.sel).map(([e,h])=>({emp:e,hours:+h||0,start,end:addTime(start,+h||0),task:(dr.task||{})[e]||''}));
    jPer=0;jTotal=0;over=true;why.push('other OT is not calculated');
  }else if(dr.type==='replacement'){
    if(dr.repl)lines=[{emp:dr.repl,hours:+dr.replHours||0,start,end:addTime(start,+dr.replHours||0),absent:dr.absent}];
    jPer=+c.normalHours;jTotal=lines.length?jPer:0;

  }else{
    const j=dr.type==='production'?justified(dr.date,dr.shift,dr.machine):deptJustified(dr.date,dr.shift,D.id);jPer=j?j.ot:null;
    const crew=dr.type==='production'?+(machine(dr.machine)?.crew)||0:0;
    lines=Object.entries(dr.sel).map(([e,h])=>({emp:e,hours:+h||0,start,end:addTime(start,+h||0),task:(dr.task||{})[e]||''}));
    if(jPer==null){over=true;why.push('no production plan')}
    else{
      jTotal=crew?jPer*crew:jPer*lines.length;
      if(lines.some(l=>l.hours>jPer)){over=true;why.push(`hours above ${fmt(jPer)} h per person`)}

}

/* ============ Division approval ============ */
const inMyDiv=r=>!V.myDiv||dept(r.dept)?.division===V.myDiv;
/* ===== Traffic light: requested OT against the planner's calculation =====
   Green: at or below the calculation. Yellow: up to the tolerance above it, or OT with no calculation (Other).
   Red: more than the tolerance above it, or production/management OT without a plan. */
const tol=()=>(+cfg().tolerance||10)/100;
function reqColor(r){
  if(r.type==='other')return 'yellow';
  if(r.type==='replacement')return r.over?'red':'green';
  if(r.justifiedPer==null)return 'red';
  const j=+r.justifiedTotal||0,q=+r.requestedTotal||0;
  if(q<=j+1e-9)return 'green';
  return q<=j*(1+tol())+1e-9?'yellow':'red';
}
function aggColor(a){return a.j>0?ratioColor(a.q,a.j):a.red?'red':(a.yellow?'yellow':'green')}
function ratioColor(q,j){if(!(j>0))return q>0?'red':'green';const x=q/j;return x<=1+1e-9?'green':x<=1+tol()+1e-9?'yellow':'red'}
const LIGHT={green:['ok','Within calc'],yellow:['warn','Slightly over'],red:['bad','Over calc']};
const light=(c,txt)=>`<span class="pill ${LIGHT[c][0]}"><span aria-hidden="true">●</span> ${txt||LIGHT[c][1]}</span>`;
const pct=(q,j)=>j>0?Math.round(q/j*100)+'%':(q>0?'no calc':'–');
function agg(rs){
  const a={n:rs.length,q:0,oth:0,j:0,act:0,actKnown:0,ppl:0,green:0,yellow:0,red:0,pend:0,reasons:{},appr:[]};
  for(const r of rs){
    if(r.type==='other')a.oth+=+r.requestedTotal||0;else a.q+=+r.requestedTotal||0;a.j+=+r.justifiedTotal||0;a.ppl+=r.lines.length;a[reqColor(r)]++;
    if(r.status==='pending')a.pend++;
    if(reqColor(r)!=='green'){const k=r.reason||'No reason given';a.reasons[k]=(a.reasons[k]||0)+1}
    for(const l of r.lines){const x=lineActual(r,l);if(x!=null){a.act+=x;a.actKnown++}}
    const sub=(r.history||[]).find(h=>h.action==='Submitted'),ok=(r.history||[]).find(h=>/Division manager (approved|rejected)/.test(h.action));
    if(sub&&ok)a.appr.push((new Date(ok.at)-new Date(sub.at))/36e5);
  }
  return a;
}
const lightCounts=a=>`${a.green?`<span class="pill ok">● ${a.green}</span> `:''}${a.yellow?`<span class="pill warn">● ${a.yellow}</span> `:''}${a.red?`<span class="pill bad">● ${a.red}</span>`:''}`;

async function setStatus(id,status,action,note){

/* ============ Attendance (fingerprint scans) ============ */
const dayNum=iso=>{const [y,m,d]=iso.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const isoOf=n=>new Date(n*864e5).toISOString().slice(0,10);
const toMin=t=>{if(!t)return null;const [h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const hhmm=m=>String(Math.floor(((m%1440)+1440)%1440/60)).padStart(2,'0')+':'+String(((m%60)+60)%60).padStart(2,'0');
const floorHalf=h=>Math.floor(h*2+1e-9)/2;
/* Scans of one employee as absolute minutes, from the uploaded days around a date. */
function scansAround(empId,baseIso){
  const out=[];const b=dayNum(baseIso);
  for(let k=-1;k<=1;k++){const d=isoOf(b+k),doc=S.attendance[d];if(!doc)continue;for(const t of (doc.scans?.[empId]||[]))out.push((b+k)*1440+toMin(t))}
  return out.sort((a,b)=>a-b);
}
/* Check one OT line against the scans.
   The OT window starts at the line's start time; for a night shift, a start before the shift start is on the next day.
   Covered from the start if there is a scan up to 12 h before (plus grace); covered to the end if there is a scan up to 4 h after (minus grace).
   Otherwise the covered part is cut at the first/last scan inside the window. Result is rounded down to 0.5 h. */
function verifyLine(r,l){
  const target=lineActual(r,l)??+l.hours;
  const sh=shift(r.shift),crosses=sh&&toMin(sh.end)<toMin(sh.start);
  let base=dayNum(r.date);const st=toMin(l.start)??toMin(defaultStart(r.date,r.shift));
  if(crosses&&st<toMin(sh.start))base+=1;
  const baseIso=isoOf(base);
  if(!S.attendance[baseIso])return {status:'nodata',verified:null,target};
  const s0=base*1440+st,e0=s0+Math.round(+l.hours*60),g=+cfg().attGrace||10;
  const sc=scansAround(l.emp,baseIso);
  const near=sc.filter(x=>x>=s0-720&&x<=e0+240);
  if(!near.length)return {status:'noscan',verified:0,target,scans:[]};
  const inOk=sc.some(x=>x>=s0-720&&x<=s0+g),outOk=sc.some(x=>x>=e0-g&&x<=e0+240);
  const inside=sc.filter(x=>x>s0&&x<e0);
  const cs=inOk?s0:(inside[0]??null),ce=outOk?e0:(inside.length?inside[inside.length-1]:null);
  const cov=cs!=null&&ce!=null&&ce>cs?floorHalf((ce-cs)/60):0;
  const verified=Math.min(cov,target);
  return {status:verified>=target-1e-9?'ok':verified>0?'short':'left',verified,target,scans:near.map(x=>hhmm(x)),first:near[0],last:near[near.length-1]};
}
const VSTAT={ok:['ok','Matches scan'],short:['warn','Left early'],left:['bad','Left before OT'],noscan:['bad','No scan'],nodata:['','Not uploaded']};

/* ============ File reading (xlsx / csv) ============ */
const cellStr=v=>v==null?'':String(v).trim();
function parseNum(v){if(typeof v==='number')return v;const n=parseFloat(cellStr(v).replace(/,/g,''));return isFinite(n)?n:null}
const TH_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MON_SHORT=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function fixYear(y){y=+y;if(y<100)y+=2000;if(y>2400)y-=543;return y}
function mkIso(y,m,d){if(!(m>=1&&m<=12&&d>=1&&d<=31))return null;return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function parseDateAny(v){
  if(typeof v==='number'&&v>20000&&v<80000)return isoOf(Math.floor(v)-25569);
  const s=cellStr(v);if(!s)return null;let m;
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/)))return mkIso(fixYear(m[1]),+m[2],+m[3]);
  if((m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/)))return mkIso(fixYear(m[1]),+m[2],+m[3]);
  if((m=s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)))return mkIso(fixYear(m[3]),+m[2],+m[1]);
  for(let i=0;i<12;i++){if(s.includes(TH_MONTHS[i])||s.includes(TH_MON_SHORT[i])){const d=s.match(/(\d{1,2})\s*(?:[^\d\s]+)\s*(\d{4})/);if(d)return mkIso(fixYear(d[2]),i+1,+d[1])}}
  return null;
}
function parseTimeAny(v){
  if(typeof v==='number'){const f=v%1;if(f>0||v<1){const mm=Math.round(f*1440);return hhmm(mm)}return null}
  const s=cellStr(v);const m=s.match(/^(\d{1,2})(\d{2})$/)||s.match(/(\d{1,2})[:.](\d{2})(?![\d\/.\-]*\d{4})/);if(!m)return null;const h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return hhmm(h*60+mi);
}
async function readTable(file,prefer){
  if(!window.XLSX)throw new Error('The file reader did not load. Check the connection and reload the page.');
  const buf=await file.arrayBuffer();let wb;
  if(/\.(csv|txt)$/i.test(file.name)){ /* text files: UTF-8, or Thai Windows encoding from older scanner software; keep every value as text */
    let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-874').decode(buf)}
    const lines=txt.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
    const SCAN=/^\s*(\S+)\s+(\d{8})\s+(\d{3,4})\s*$/;
    if(lines.length&&lines.slice(0,20).every(l=>SCAN.test(l))) /* fingerprint scanner export: employee ID, date, time per line, no header */
      return [['Employee ID','Date','Time']].concat(lines.map(l=>{const m=l.match(SCAN);return m?[m[1],m[2],m[3]]:['','','']}));
    wb=XLSX.read(txt.replace(/^\uFEFF/,''),{type:'string',raw:true});
  }else wb=XLSX.read(buf,{type:'array',cellDates:false});
  const name=prefer&&wb.SheetNames.find(n=>n.toLowerCase()===String(prefer).toLowerCase());
  const ws=wb.Sheets[name||wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
}

function aggregatePlan(ad,rows,from,to){

    const sh=planShift(r[ad.shift]);if(!sh)continue;

    const k=ad.mult!=null?(parseNum(r[ad.mult])||0):1;const q=(parseNum(r[ad.qty])||0)*k;const a=ad.act.reduce((s,c)=>s+(parseNum(r[c])||0),0)*k;const hasA=ad.act.some(c=>cellStr(r[c])!=='');

    const pm=o.per[mname]=o.per[mname]||{q:0,a:0};pm.q+=q;pm.a+=a;if(hasA)o.anyAct=true;

    const m=machine(o.machine);if(!m||!(+m.rate>0))continue;
    const det=Object.entries(o.per).map(([n,v])=>({m:n,q:v.q,a:v.a,h:+(v.q/m.rate).toFixed(2),ah:+(v.a/m.rate).toFixed(2)})).sort((x,y)=>y.h-x.h);
    const Q=det.reduce((s,x)=>s+x.q,0),A=det.reduce((s,x)=>s+x.a,0);

function syncSlot(now=new Date()){const d=todayStr(),h=now.getHours();return h>=17?d+' 17:00':h>=8?d+' 08:00':addDays(d,-1)+' 17:00'}

/* A read past the last row of a tab is refused with "exceeds grid limits. Max rows: N"; report N so the caller can stay inside the tab. */
async function sheetsValues(mcp,id,range){

  catch(e){const m=String((e&&e.message)||'').match(/exceeds grid limits[^]*?Max rows:\s*(\d+)/i);if(m)throw {grid:+m[1],code:'grid'};throw e}

/* First data row on or after a date: binary search on the date column (blank rows at the end count as "after"). */
async function findStart(mcp,id,ad,target,hint){

  if(hint&&hint.row&&hint.date&&hint.date<=target&&hint.row<hi)lo=Math.max(lo,hint.row);
  const col=String.fromCharCode(65+ad.date);

    try{v=await sheetsValues(mcp,id,`'${ad.tab}'!${col}${mid}:${col}${mid}`)}
    catch(e){if(e&&e.grid){hi=Math.min(mid,e.grid+1);ad._rows=e.grid;continue}throw e}
    const d=parseDateAny(v[0]&&v[0][0]);

}

function matchMachine(deptText,machText){
  const code=(cellStr(deptText).match(/^\s*(\d{3,4})/)||[])[1]||'';
  const norm=x=>cellStr(x).toLowerCase().replace(/\(.*?\)/g,'').replace(/\s+/g,'');
  const ms=cfg().machines||[],mt=norm(machText);
  const fam=m=>code&&(m.dept===code||m.dept.slice(0,-1)===code.slice(0,-1)||m.name.includes('('+code+')'));
  let c=mt?ms.filter(m=>fam(m)&&norm(m.name)===mt):[];if(c.length===1)return c[0].id;
  c=mt?ms.filter(m=>norm(m.name)===mt):[];if(c.length===1)return c[0].id;
  if(!mt&&code){c=ms.filter(m=>m.dept===code);if(c.length===1)return c[0].id}

/* Reads the plan sheet layout: a date in the first rows, a header row with "Plan", then one row per machine. */
function parsePlanRows(rows){
  let date=null;for(const r of rows.slice(0,4)){for(const c of r){const d=parseDateAny(c);if(d){date=d;break}}if(date)break}
  let h=-1,pc=-1,dc=-1,mc=-1;
  for(let i=0;i<Math.min(rows.length,10);i++){const r=rows[i].map(cellStr);const p=r.findIndex(x=>/^(plan|แผน|แผนผลิต|qty|quantity)$/i.test(x));if(p>=0){h=i;pc=p;dc=r.findIndex(x=>/แผนก|dept|department/i.test(x));mc=r.findIndex(x=>/เครื่อง|machine|line/i.test(x));break}}
  if(h<0)return {error:'Could not find a column named "Plan" in the first 10 rows.'};
  if(dc<0)dc=Math.max(0,pc-5);
  const items=[];
  for(const r of rows.slice(h+1)){
    const dt=cellStr(r[dc]),mtx=mc>=0?cellStr(r[mc]):'';if(!dt&&!mtx)continue;
    const qty=parseNum(r[pc]);

}

function attParsed(){

/* ============ Statistics ============ */
function vStats(){
  const c=cfg(),rs=Object.values(S.requests).filter(r=>r.status!=='rejected'&&r.date>=V.sFrom&&r.date<=V.sTo);
  const byD={},mAct={};let act=0,act2=0,rep=0,overN=0;const byType={production:0,management:0,replacement:0,other:0},reasons={},byEmp={};
  for(const r of rs){
    const x=byD[r.dept]=byD[r.dept]||{j:0,req:0,act:0,prodAct:0};
    x.j+=+r.justifiedTotal||0;x.req+=+r.requestedTotal||0;if(r.over){overN++;reasons[r.reason||'No reason']=(reasons[r.reason||'No reason']||0)+1}
    for(const l of r.lines){const a=lineActual(r,l);if(a==null)continue;x.act+=a;act+=a;if(+r.mult===2)act2+=a;byType[r.type]+=a;if(r.type==='production'){x.prodAct+=a;mAct[r.machine]=(mAct[r.machine]||0)+a}if(r.type==='replacement')rep+=a;byEmp[l.emp]=(byEmp[l.emp]||0)+a}
  }
  const qty={};Object.values(S.plans).forEach(p=>{if(p.date>=V.sFrom&&p.date<=V.sTo&&p.machine)qty[p.machine]=(qty[p.machine]||0)+ +p.qty});
  const ds=c.depts.filter(D=>byD[D.id]);
  const mx=Math.max(1,...ds.flatMap(D=>[byD[D.id].j,byD[D.id].req,byD[D.id].act]));
  const bar=(v,col)=>`<div class="track"><i style="width:${(v/mx*100).toFixed(1)}%;background:var(${col})"></i><em>${fmt(v)}</em></div>`;
  const tMax=Math.max(1,...Object.values(byType));
  const top=Object.entries(byEmp).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return `<div><h2>Statistics</h2><p class="muted">Approved and pending OT, rejected requests excluded. Actual hours count only where managers have entered them.</p></div>
  <div class="card"><div class="row"><label class="f grow">From<input type="date" id="sf" data-bind="sfrom" value="${V.sFrom}"></label><label class="f grow">To<input type="date" id="st" data-bind="sto" value="${V.sTo}"></label></div></div>
  <div class="kpis"><div class="kpi"><span>Actual OT hours</span><b>${fmt(act)}</b></div><div class="kpi"><span>Of which at 2×</span><b>${fmt(act2)}</b></div><div class="kpi"><span>Replacement OT h</span><b>${fmt(rep)}</b></div><div class="kpi"><span>Requests above calc</span><b>${overN}/${rs.length}</b></div></div>
  <div class="card"><h3>Justified vs requested vs actual, by department</h3>
  <div class="legend"><span style="--c:var(--bar-1)">Justified</span><span style="--c:var(--bar-2)">Requested</span><span style="--c:var(--bar-3)">Actual</span></div>
  ${ds.length?`<div class="bars">${ds.map(D=>`<div class="bargroup"><div class="lbl">${esc(D.name)}</div>${bar(byD[D.id].j,'--bar-1')}${bar(byD[D.id].req,'--bar-2')}${bar(byD[D.id].act,'--bar-3')}</div>`).join('')}</div>`:`<div class="empty">No OT in this period.</div>`}</div>
  <div class="split">
   <div class="card"><h3>Production OT per 1,000 units</h3><p class="small muted">Actual production OT hours ÷ planned quantity × 1,000. Lower is better.</p>
    <div class="tablewrap"><table><thead><tr><th>Machine</th><th class="r">Plan qty</th><th class="r">OT h</th><th class="r">OT h / 1,000</th></tr></thead><tbody>
    ${(c.machines||[]).filter(m=>qty[m.id]).map(m=>`<tr><td>${esc(m.name)}<div class="small muted">${esc(dept(m.dept)?.name||'')}</div></td><td class="r num">${fmt(qty[m.id],0)} ${esc(m.unit)}</td><td class="r num">${fmt(mAct[m.id]||0)}</td><td class="r num">${fmt((mAct[m.id]||0)/qty[m.id]*1000,2)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No plans in this period.</td></tr>'}</tbody></table></div></div>
   <div class="card"><h3>Actual OT by type</h3><div class="bars">${Object.entries(byType).map(([k,v])=>`<div class="bargroup" style="grid-template-columns:110px 1fr"><div class="lbl" style="grid-row:auto">${TYPE[k]}</div><div class="track"><i style="width:${(v/tMax*100).toFixed(1)}%;background:var(--bar-3)"></i><em>${fmt(v)} h</em></div></div>`).join('')}</div>
    <h3>Reasons for extra OT</h3>${Object.keys(reasons).length?`<table><tbody>${Object.entries(reasons).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r num">${v}</td></tr>`).join('')}</tbody></table>`:'<p class="muted small">No requests above the calculation.</p>'}</div>

const MGMT=/(หัวหน้า|ผู้จัดการ|วิศวกร|supervisor|manager|leader|head|chief|foreman|engineer|\bqc\b)/i;
function doImport(modeV){
  const s=V.setup,txt=V.importText.trim();if(!txt)return toast('Paste the staff list first');
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  if(/name/i.test(lines[0])&&/dep/i.test(lines[0]))lines.shift();
  const out=[];let added=0;
  for(const ln of lines){
    const c=(ln.includes('\t')?ln.split('\t'):ln.split(',')).map(x=>x.trim());
    const [name,crew,dn,pos]=c;if(!name)continue;
    const low=(dn||'').toLowerCase(),code=(dn||'').match(/^\s*(\d{3,4})\b/)?.[1];
    let d=s.depts.find(x=>x.id.toLowerCase()===low||x.name.toLowerCase()===low||(code&&x.id===code));
    if(!d&&dn){d={id:code||dn.replace(/[^A-Za-z0-9]/g,'').slice(0,6).toUpperCase()||'D'+s.depts.length,name:dn,division:''};while(s.depts.some(x=>x.id===d.id))d.id+='1';s.depts.push(d);added++}
    const kind=MGMT.test(pos||'')?'management':'production';
    out.push({id:'E'+uid(),name,crew:crew||'',dept:d?.id||'',position:pos||'',kind,link:d?.id||''});
  }
  s.employees=modeV==='replace'?out:s.employees.concat(out);
  V.importText='';render();toast(`${out.length} staff imported${added?`, ${added} new department${added>1?'s':''} (set their rates)`:''}. Press Save setup.`);
}
async function saveSetup(){
  const s=V.setup;const ids=s.depts.map(d=>d.id);
  if(new Set(ids).size!==ids.length||ids.some(x=>!x))return toast('Each department needs a unique code');
  const out={...s,example:false};
  out.machines=s.machines.map(m=>({...m,rate:+m.rate||0,crew:+m.crew||0}));
  ['normalHours','rateWeekday','rateWeekend','rateHoliday','tolerance','attGrace'].forEach(k=>out[k]=+(out[k]??(k==='tolerance'||k==='attGrace'?10:0)));
  const emps=out.employees||[];delete out.employees;
  const groups={};for(const e of emps){(groups[e.dept||'none']=groups[e.dept||'none']||[]).push([e.id,e.name,e.crew,e.position,e.kind,e.link])}
  try{
    await put('config','main',out);
    for(const [d,list] of Object.entries(groups)){const cur=S.staff[d];const doc={list};if(!cur||JSON.stringify(cur.list)!==JSON.stringify(list))await put('staff',d,doc)}
    for(const d of Object.keys(S.staff))if(!groups[d])await del('staff',d);
    V.setup=null;toast('Setup saved')
  }catch(e){toast('Could not save: '+(e.message||e.code))}
}
async function wipe(){
  if(($('#wipeconf')?.value||'').trim()!=='DELETE')return toast('Type DELETE to confirm');
  try{for(const c of [...COLLS,'attendance'])for(const id of Object.keys(S[c]))await del(c,id);toast('Test data deleted')}catch(e){toast('Could not delete: '+(e.message||e.code))}
}


/* ============ Admin: users from the HR authorization sheet ============ */
function hrHeaderIndex(rows){for(let i=0;i<Math.min(rows.length,12);i++){const r=rows[i].map(x=>cellStr(x).toLowerCase());if(r.some(x=>x.includes('login email')))return i}return -1}
function parseHrUsers(rows){
  const h=hrHeaderIndex(rows);if(h<0)return {error:'Could not find the "Login email" column. Use the Users tab of the HR authorization template.'};
  const H=rows[h].map(x=>cellStr(x).toLowerCase());const col=k=>H.findIndex(x=>x.startsWith(k));
  const C={id:col('employee id'),name:col('full name'),email:col('login email'),role:col('role'),codes:col('department codes'),div:col('division'),active:col('active'),comp:col('company')};
  const by={},skipped=[];
  for(const r of rows.slice(h+1)){
    const email=cellStr(r[C.email]).toLowerCase(),roleName=cellStr(r[C.role]);
    if(!email&&!roleName)continue;
    if(cellStr(r[C.id])==='60X9999'||/example/i.test(cellStr(r[C.name])))continue;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||!ROLE_KEYS[roleName]){skipped.push((cellStr(r[C.name])||email||'?')+(ROLE_KEYS[roleName]?'':' (role?)'));continue}
    if(cellStr(r[C.active]).toLowerCase()!=='yes'){skipped.push((cellStr(r[C.name])||email)+' (not active)');continue}
    const u=by[email]=by[email]||{email,name:cellStr(r[C.name]),empId:cellStr(r[C.id]),company:cellStr(r[C.comp]),roleNames:[],depts:[],divisions:[],active:true};
    if(!u.roleNames.includes(roleName))u.roleNames.push(roleName);
    for(const c of cellStr(r[C.codes]).split(/[,\s]+/).filter(Boolean))if(!u.depts.includes(c))u.depts.push(c);
    const dv=cellStr(r[C.div]);if(dv&&!u.divisions.includes(dv))u.divisions.push(dv);
  }
  return {users:Object.values(by),skipped};
}
function vUsers(){
  const list=Object.values(S.users||{}).sort((a,b)=>(a.name||a.email).localeCompare(b.name||b.email));const P=V.hrImport;
  return `<div><h2>Users and roles</h2><p class="muted">Load the Users tab of the HR authorization sheet. Only rows with a login email, a role and Active = Yes are loaded. People with several rows get all their roles.</p></div>

function vData(){
  return `<div><h2>Data</h2><p class="muted">Load the data file from the claude.ai version (settings, departments, machines, staff), or save a backup of everything.</p></div>
  <div class="card"><h3>Load data file</h3><p class="small muted">Existing records with the same name are replaced. Nothing else is deleted.</p>
   <div class="row"><label class="btn primary" for="datafile" style="display:inline-flex;align-items:center">Choose data file (.json)</label><input type="file" id="datafile" accept=".json" hidden></div>
   ${V.dataMsg?`<div class="note small">${V.dataMsg}</div>`:''}</div>
  <div class="card"><h3>Backup</h3><p class="small muted">Downloads everything in one JSON file. Keep it private: it contains staff names.</p><div class="row"><button class="btn" data-act="databackup">Download backup</button></div></div>`;
}
async function dataImport(file){
  try{const o=JSON.parse(await file.text());let n=0;const writes=[];
    if(o.config)writes.push(['config','main',o.config]);
    for(const c of DATA_COLLS)for(const [id,d] of Object.entries(o[c]||{}))writes.push([c,id,d]);
    V.dataMsg=`Loading ${writes.length} records…`;render();
    for(let i=0;i<writes.length;i+=400){const b=db.batch();for(const [c,id,d] of writes.slice(i,i+400))b.set(c==='config'?db.doc('config/main'):db.collection(c).doc(id),JSON.parse(JSON.stringify(d)));await b.commit();n+=Math.min(400,writes.length-i)}
    V.dataMsg=`Loaded ${n} records.`;render();
  }catch(e){V.dataMsg='Could not load the file: '+esc(e.message||e.code||e);render()}
}
async function dataBackup(){
  const o={config:S.config};for(const c of DATA_COLLS)o[c]=S[c];
  const blob=new Blob([JSON.stringify(o)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vtr-ot-backup-'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();
}
/* ============ Events ============ */
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='role'){role=t.value;lsSet('otp-role',role);tab=lsGet('otp-tab-'+role)||ROLES[role].tabs[0][0];render();return}
  if(t.id==='planfile'&&t.files[0]){const f=t.files[0];t.value='';readTable(f).then(rows=>setImport(parsePlanRows(rows),'file '+f.name)).catch(e=>{V.impMsg='Could not read the file: '+esc(e.message||e);render()});return}
  if(t.id==='attfile'&&t.files[0]){const f=t.files[0];t.value='';onAttFile(f);return}
  if(t.id==='hrfile'&&t.files[0]){const f=t.files[0];t.value='';readTable(f,'Users').then(rows=>{V.hrImport=parseHrUsers(rows);render()}).catch(e=>{V.hrImport={error:'Could not read the file: '+(e.message||e)};render()});return}
  if(t.id==='datafile'&&t.files[0]){const f=t.files[0];t.value='';dataImport(f);return}
  if(t.id==='mydept'){myDept=t.value;lsSet('otp-dept',myDept);V.draft&&V.draft.editId&&(V.draft=null);V.draft&&(V.draft.sel={},V.draft.prefillKey='',V.draft.absent='',V.draft.repl='',V.draft.machine='');render();return}
  const b=t.dataset.bind;if(!b)return;
  const dr=V.draft;
  switch(b){
    case 'pdate':V.planDate=t.value;render();break;
    case 'pshift':V.planShift=t.value;render();break;
    case 'ddate':dr.date=t.value;dr.start='';dr.sel={};dr.prefillKey='';dr.machine='';render();break;
    case 'dshift':dr.shift=t.value;dr.start='';dr.sel={};dr.prefillKey='';dr.machine='';render();break;
    case 'dabsent':dr.absent=t.value;dr.repl='';render();break;
    case 'drepl':dr.repl=t.value;refreshSum();break;
    case 'dmach':dr.machine=t.value;dr.sel={};dr.prefillKey='';dr.reason='';render();break;
    case 'dreason':dr.reason=t.value;break;
    case 'dsel':{dr.touched=true;const id=t.dataset.e,h=$('#h-'+id);if(t.checked){dr.sel[id]=+h.value||0;h.disabled=false;const w=t.parentElement.querySelector('.who');if(w&&!w.querySelector('input')){const i=document.createElement('input');i.id='task-'+id;i.dataset.bind='dtask';i.dataset.e=id;i.placeholder='Task / area (optional)';i.style.cssText='margin-top:6px;min-height:36px;padding:6px 8px;font-size:14px';i.value=(dr.task||{})[id]||'';w.appendChild(i)}}else{delete dr.sel[id];h.disabled=true;t.parentElement.querySelector('.who input')?.remove()}refreshSum();break}
    case 'dailydate':V.dailyDate=t.value;render();break;
    case 'pfrom':V.from=t.value;V.csv='';render();break;
    case 'pto':V.to=t.value;V.csv='';render();break;
    case 'sfrom':V.sFrom=t.value;render();break;
    case 'sdept':V.setupDept=t.value;render();break;
    case 'impdate':V.imp.date=t.value;render();break;
    case 'impshift':V.imp.shift=t.value;render();break;
    case 'impmach':V.imp.items[+t.dataset.i].mid=t.value;render();break;
    case 'pbasis':V.payBasis=t.value;V.csv='';render();break;
    case 'attmap':V.att.map[t.dataset.k]=+t.value;render();break;
    case 'divdate':V.divDate=t.value;render();break;
    case 'dfrom':V.dFrom=t.value;render();break;
    case 'dto':V.dTo=t.value;render();break;
    case 'mydiv':V.myDiv=t.value;lsSet('otp-div',V.myDiv);render();break;
    case 'sto':V.sTo=t.value;render();break;
    case 's':case 'sa':setupBind(t);if(t.tagName==='SELECT'||t.type==='checkbox')render();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,b=t.dataset.bind,dr=V.draft;if(!b)return;
  switch(b){
    case 'planqty':planPreview(t.dataset.d);break;
    case 'dhrs':dr.touched=true;if(t.dataset.e in dr.sel){dr.sel[t.dataset.e]=+t.value||0;refreshSum()}break;
    case 'dtask':(dr.task=dr.task||{})[t.dataset.e]=t.value;break;
    case 'dstart':dr.start=t.value;break;
    case 'dreplh':dr.replHours=+t.value||0;refreshSum();break;
    case 'dnote':dr.note=t.value;break;
    case 'imp':V.importText=t.value;break;
    case 's':case 'sa':if(t.tagName!=='SELECT'&&t.type!=='checkbox')setupBind(t);break;
  }
});
function setupBind(t){
  const s=V.setup;if(!s)return;
  if(t.dataset.bind==='s'){const p=t.dataset.p;
    if(p==='autoApprove')s[p]=t.checked;else if(p==='holidays')s[p]=t.value.split(/[,\s]+/).filter(Boolean);else if(p==='reasons')s[p]=t.value.split('\n').map(x=>x.trim()).filter(Boolean);else s[p]=t.value;return}
  const arr=s[t.dataset.a],i=+t.dataset.i,p=t.dataset.p;if(!arr[i])return;
  if(t.dataset.a==='depts'&&p==='id'){const old=arr[i].id;s.employees.forEach(x=>{if(x.dept===old)x.dept=t.value;if(x.link===old)x.link=t.value});s.machines.forEach(m=>{if(m.dept===old)m.dept=t.value})}
  arr[i][p]=t.value;
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,dr=V.draft;
  switch(a){
    case 'tab':tab=t.dataset.v;lsSet('otp-tab-'+role,tab);if(tab==='setup')V.setup=null;render();window.scrollTo(0,0);break;
    case 'saveplan':savePlan();break;
    case 'dtype':dr.type=t.dataset.v;dr.sel={};dr.prefillKey='';dr.reason='';dr.start='';render();break;
    case 'selcrew':{dr.touched=true;const g=t.dataset.v;dr.sel={};document.querySelectorAll('[data-bind="dsel"]').forEach(cb=>{const e=emp(cb.dataset.e);if(e&&crewGroup(e.crew)===g){const h=$('#h-'+cb.dataset.e);dr.sel[cb.dataset.e]=+h.value||0}});render();toast(`Selected ${Object.keys(dr.sel).length} people from ${crewLabel(g)}`);break}
    case 'selnone':dr.sel={};dr.touched=true;render();break;
    case 'copylast':{const r=lastReq(dr.type);if(!r)break;dr.sel={};dr.task={};for(const l of r.lines)if(emp(l.emp)){dr.sel[l.emp]=l.hours;if(l.task)dr.task[l.emp]=l.task}dr.start=r.lines[0]?.start||'';if(r.reason)dr.reason=r.reason;render();toast(`Copied ${Object.keys(dr.sel).length} people. Untick anyone absent.`);break}
    case 'submitreq':submitReq();break;
    case 'editreq':{const r=S.requests[t.dataset.id];if(!r)break;myDept=r.dept;
      const d={...newDraft(),date:r.date,shift:r.shift,type:r.type,machine:r.machine||'',sel:{},task:{},start:r.lines[0]?.start||'',reason:r.reason||'',note:r.note||'',editId:r.id,prefillKey:'edit',touched:true};
      if(r.type==='replacement'){const l=r.lines[0]||{};d.absent=l.absent||'';d.repl=l.emp||'';d.replHours=l.hours||+cfg().normalHours}
      else for(const l of r.lines){d.sel[l.emp]=l.hours;if(l.task)d.task[l.emp]=l.task}
      V.draft=d;tab='request';render();window.scrollTo(0,0);break}
    case 'canceledit':V.draft=null;render();break;
    case 'signin':firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast('Sign-in failed: '+(e.message||e.code)));break;
    case 'signout':firebase.auth().signOut();break;
    case 'hrsave':hrSave();break;
    case 'hrcancel':V.hrImport=null;render();break;
    case 'databackup':dataBackup();break;
    case 'loadplan':loadLinkedPlan();break;
    case 'syncnow':runSync(true);break;
    case 'saveimport':saveImport();break;
    case 'cancelimport':V.imp=null;V.impMsg='';render();break;
    case 'attsave':attSave();break;
    case 'attcancel':V.att=null;render();break;
    case 'attfilter':V.attFilter=t.dataset.v;render();break;
    case 'cancelreq':await del('requests',t.dataset.id);toast('Request withdrawn');break;
    case 'fdate':V.filterDate=t.dataset.v;render();break;
    case 'divok':await setStatus(t.dataset.id,'div_approved','Division manager approved',$('#n-'+CSS.escape(t.dataset.id))?.value);toast('Approved');break;
    case 'divback':{const n=($('#n-'+CSS.escape(t.dataset.id))?.value||'').trim();if(!n){toast('Write in the comment what the manager should change');$('#n-'+CSS.escape(t.dataset.id))?.focus();break}await setStatus(t.dataset.id,'returned','Sent back for changes',n);toast('Sent back to the department manager');break}
    case 'divno':await setStatus(t.dataset.id,'rejected','Division manager rejected',$('#n-'+CSS.escape(t.dataset.id))?.value);toast('Rejected');break;
    case 'approvewithin':{const l=Object.values(S.requests).filter(r=>r.status==='pending'&&!r.over&&inMyDiv(r));for(const r of l)await setStatus(r.id,'div_approved','Division manager approved','');toast(`Approved ${l.length}`);break}
    case 'ddate':V.dailyDate=t.dataset.v;render();break;
    case 'divdate':V.divDate=t.dataset.v;render();break;
    case 'dashdiv':V.dashDiv=t.dataset.v;render();break;
    case 'divdept':{const l=Object.values(S.requests).filter(r=>r.status==='pending'&&r.date===V.divDate&&r.dept===t.dataset.v);for(const r of l)await setStatus(r.id,'div_approved','Division manager approved','');toast(`Approved ${l.length}`);break}
    case 'approvegreen':{const l=Object.values(S.requests).filter(r=>r.status==='pending'&&r.date===V.divDate&&inMyDiv(r)&&reqColor(r)==='green');for(const r of l)await setStatus(r.id,'div_approved','Division manager approved','');toast(`Approved ${l.length}`);break}
    case 'plantok':plantDecide(true);break;
    case 'plantback':plantDecide(false);break;
    case 'saveact':{const k=t.dataset.k,v=$('#act-'+CSS.escape(k)).value;if(v==='')return toast('Enter the actual run hours');const[date,sh,...dp]=k.split('_');const mid=dp.join('_');
      try{await put('actuals',k,{date,shift:sh,machine:mid,dept:machine(mid)?.dept||'',run:+v,at:new Date().toISOString(),by:me.id||null});toast('Actual hours saved')}catch(err){toast('Could not save: '+(err.message||err.code))}break}
    case 'worked':{const r=S.requests[t.dataset.id];if(!r)break;const lines=r.lines.map((l,i)=>i===+t.dataset.i?{...l,worked:t.dataset.v==='1'}:l);
      try{await put('requests',r.id,{...r,lines,history:hist(r,t.dataset.v==='1'?'Confirmed worked':'Marked did not work')});toast('Saved')}catch(err){toast('Could not save')}break}
    case 'csv':doCsv();break;
    case 'copycsv':{const ta=$('#csvout');try{await navigator.clipboard.writeText(ta.value);toast('Copied')}catch(err){ta.select();toast('Press Ctrl+C / Cmd+C to copy')}break}
    case 'sadd':{const s=V.setup;if(t.dataset.a==='shifts')s.shifts.push({id:'S'+uid(),name:'New shift',start:'00:00',end:'08:00'});else if(t.dataset.a==='machines')s.machines.push({id:'M'+uid(),dept:s.depts[0]?.id||'',name:'New machine',unit:'',rate:0,crew:0});else s.depts.push({id:'NEW'+s.depts.length,name:'New department',division:''});render();break}
    case 'srm':V.setup[t.dataset.a].splice(+t.dataset.i,1);render();break;
    case 'import':doImport(t.dataset.v);break;
    case 'savesetup':saveSetup();break;
    case 'resetsetup':V.setup=null;render();break;
    case 'wipe':wipe();break;
  }
});

render();
initStore();
</script>
